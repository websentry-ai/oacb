# OACB Codex Configuration — baseline tier
# Install with: unbound oacb apply --agent codex --tier baseline
#
# Baseline tier: block high-confidence destructive patterns, allow most
# autonomous work. Recommended starting point for most teams.
#
# _oacb metadata (inline — Codex ignores unknown tables at strictValidation=false)
# name:    "OACB Codex Profile"
# version: "0.1.1"
# tier:    "baseline"
# repo:    "https://github.com/websentry-ai/oacb"

approval_policy = "on-request"
sandbox_mode    = "workspace-write"

[shell_environment_policy]
inherit  = "core"
exclude  = ["AWS_*", "AZURE_*", "GCP_*", "GOOGLE_*", "*_SECRET*", "*_TOKEN*", "*_KEY*", "*_CREDENTIAL*", "*_PASSWORD*"]

# PreToolUse — Bash: enforce OACB rules, exit 2 on deny
[[hooks.PreToolUse]]
matcher = "^Bash$"
[[hooks.PreToolUse.hooks]]
type    = "command"
command = "~/.codex/hooks/oacb-enforce.sh"
timeout = 5
env     = { OACB_TIER = "baseline" }

# PreToolUse — MCP: block known-malicious servers, warn on unapproved
[[hooks.PreToolUse]]
matcher = "^mcp__.*$"
[[hooks.PreToolUse.hooks]]
type    = "command"
command = "~/.codex/hooks/oacb-mcp-guard.sh"
timeout = 3
env     = { OACB_TIER = "baseline" }

# UserPromptSubmit: block bidi/invisible Unicode and credential pastes
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type    = "command"
command = "~/.codex/hooks/oacb-prompt-guard.sh"
timeout = 3
env     = { OACB_TIER = "baseline" }

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type    = "command"
command = "~/.codex/hooks/oacb-post-tool.sh"
timeout = 3
env     = { OACB_TIER = "baseline" }

[[hooks.PostToolUseFailure]]
matcher = ".*"
[[hooks.PostToolUseFailure.hooks]]
type    = "command"
command = "~/.codex/hooks/oacb-post-tool.sh"
timeout = 3
env     = { OACB_TIER = "baseline" }
