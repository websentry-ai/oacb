name: Release

on:
  push:
    branches: [dev/conformance]

permissions:
  contents: write      # create release, upload assets
  id-token: write      # OIDC token for cosign keyless signing and GitHub attestations
  attestations: write  # SLSA L2 provenance via actions/attest-build-provenance

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Build release tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          tar -czf "oacb-${VERSION}.tar.gz" \
            --transform "s|^|oacb-${VERSION}/|" \
            baseline/ \
            schemas/ \
            conformance-tests/ \
            adversarial-corpus/ \
            false-positive-corpus/ \
            README.md \
            SECURITY.md \
            PROVENANCE.md \
            MAINTAINERS.md \
            COMPATIBILITY.md \
            non-claims.md \
            threat-model.md \
            baseline/claude-code/CLAUDE.md.example \
            LICENSE
          sha256sum "oacb-${VERSION}.tar.gz" | tee checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball (keyless OIDC)
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cosign sign-blob --yes \
            --output-signature "oacb-${VERSION}.tar.gz.sig" \
            --output-certificate "oacb-${VERSION}.tar.gz.crt" \
            "oacb-${VERSION}.tar.gz"

      - name: Generate SLSA L2 build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'oacb-${{ github.ref_name }}.tar.gz'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "${VERSION}" \
            --title "OACB ${VERSION}" \
            --generate-notes \
            "oacb-${VERSION}.tar.gz" \
            "oacb-${VERSION}.tar.gz.sig" \
            "oacb-${VERSION}.tar.gz.crt" \
            "checksums.txt"
